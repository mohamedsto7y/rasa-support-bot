recipe: default.v1
language: en  # one mixed English / Egyptian-Arabic model; char n-grams carry the Arabic
assistant_id: tp-support-bot

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer          # order_id / phone_number patterns from nlu.yml
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer   # word bag
  - name: CountVectorsFeaturizer   # char n-grams: robust to Arabic morphology and typos
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier           # joint intent + entity model
    epochs: 100
    constrain_similarities: true
  - name: EntitySynonymMapper      # "broken" / "مكسور" -> damaged
  - name: ResponseSelector         # retrieval intent faq/*
    epochs: 100
    retrieval_intent: faq
    constrain_similarities: true
  - name: FallbackClassifier       # low confidence -> nlu_fallback
    threshold: 0.4
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
