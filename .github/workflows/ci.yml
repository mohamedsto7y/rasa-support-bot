name: rasa-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-train-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate training data
        run: rasa data validate
      - name: Train
        run: rasa train
      - name: Test NLU and dialogue
        run: rasa test --stories tests/test_stories.yml --fail-on-prediction-errors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rasa-test-results
          path: results/
